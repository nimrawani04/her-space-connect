<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Circle with Soft Blush Sanctuary Gradient -->
    <linearGradient id="hs-bloom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="35%" stop-color="#f472b6" />
      <stop offset="70%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>

    <!-- Petal Gradient (Delicate Rose Pink to Soft White) -->
    <linearGradient id="hs-petal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>

    <!-- Petal Border / Depth Accent -->
    <linearGradient id="hs-petal-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fbcfe8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Golden Pistil Center -->
    <radialGradient id="hs-gold-center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="hs-flower-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#701a35" flood-opacity="0.3" />
    </filter>

    <!-- Base Petal Geometry Template centered at origin pointing up -->
    <path
      id="petal-shape"
      d="M 0 0 C -11 -12 -21 -25 -16 -40 C -13 -48 -4 -50 0 -43 C 4 -50 13 -48 16 -40 C 21 -25 11 -12 0 0 Z"
    />
  </defs>

  <!-- 1. Circular Sanctuary Badge with Glass Sheen -->
  <circle cx="50" cy="50" r="47" fill="url(#hs-bloom-bg)" />
  <circle cx="50" cy="50" r="46.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Inner Soft Glow Aura -->
  <circle cx="50" cy="50" r="38" fill="#ffffff" fill-opacity="0.12" />

  <!-- 2. The Blooming 5-Petal Flower -->
  <g transform="translate(50, 50)" filter="url(#hs-flower-shadow)">
    <!-- 5 Radial Petals with Delicate Notched Tips -->
    <!-- Petal 1: Top (0 deg) -->
    <use href="#petal-shape" fill="url(#hs-petal)" stroke="url(#hs-petal-stroke)" stroke-width="0.8" />
    <!-- Petal 2: Top-Right (72 deg) -->
    <use href="#petal-shape" transform="rotate(72)" fill="url(#hs-petal)" stroke="url(#hs-petal-stroke)" stroke-width="0.8" />
    <!-- Petal 3: Bottom-Right (144 deg) -->
    <use href="#petal-shape" transform="rotate(144)" fill="url(#hs-petal)" stroke="url(#hs-petal-stroke)" stroke-width="0.8" />
    <!-- Petal 4: Bottom-Left (216 deg) -->
    <use href="#petal-shape" transform="rotate(216)" fill="url(#hs-petal)" stroke="url(#hs-petal-stroke)" stroke-width="0.8" />
    <!-- Petal 5: Top-Left (288 deg) -->
    <use href="#petal-shape" transform="rotate(288)" fill="url(#hs-petal)" stroke="url(#hs-petal-stroke)" stroke-width="0.8" />

    <!-- Delicate Inner Blossom Vein Accents -->
    <g stroke="#f472b6" stroke-width="0.9" stroke-linecap="round" opacity="0.65">
      <line x1="0" y1="-8" x2="0" y2="-28" />
      <line x1="0" y1="-8" x2="0" y2="-28" transform="rotate(72)" />
      <line x1="0" y1="-8" x2="0" y2="-28" transform="rotate(144)" />
      <line x1="0" y1="-8" x2="0" y2="-28" transform="rotate(216)" />
      <line x1="0" y1="-8" x2="0" y2="-28" transform="rotate(288)" />
    </g>

    <!-- Stamens / Pollen Dots (5 Delicate Golden Filaments) -->
    <g stroke="#f59e0b" stroke-width="1.1" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-15" />
      <circle cx="0" cy="-15" r="1.6" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />

      <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(72)" />
      <circle cx="0" cy="-15" r="1.6" transform="rotate(72)" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />

      <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(144)" />
      <circle cx="0" cy="-15" r="1.6" transform="rotate(144)" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />

      <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(216)" />
      <circle cx="0" cy="-15" r="1.6" transform="rotate(216)" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />

      <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(288)" />
      <circle cx="0" cy="-15" r="1.6" transform="rotate(288)" fill="#fef08a" stroke="#d97706" stroke-width="0.6" />
    </g>

    <!-- Center Blossom Pearl / Pistil Core -->
    <circle cx="0" cy="0" r="4.8" fill="url(#hs-gold-center)" stroke="#ffffff" stroke-width="1" />
  </g>
</svg>
